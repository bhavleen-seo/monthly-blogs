name: Bitwarden WP credentials sync

on:
  schedule:
    # Daily at 06:00 UTC (17:00 Melbourne winter / 16:00 summer)
    - cron: "0 6 * * *"
  workflow_dispatch: {} # manual trigger from the dashboard sync button

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BW_CLIENTID: ${{ secrets.BW_CLIENTID }}
      BW_CLIENTSECRET: ${{ secrets.BW_CLIENTSECRET }}
      BW_PASSWORD: ${{ secrets.BW_PASSWORD }}
      INGEST_URL: ${{ secrets.INGEST_URL }}
      SYNC_INGEST_TOKEN: ${{ secrets.SYNC_INGEST_TOKEN }}
    steps:
      - name: Install Bitwarden CLI
        run: npm install -g @bitwarden/cli

      - name: Login (API key)
        # Discard login stdout — bw prints the "export BW_SESSION=..."
        # helper string which would end up in the public build log.
        run: bw login --apikey --nointeraction > /dev/null

      - name: Unlock and export session
        id: unlock
        run: |
          session=$(bw unlock --passwordenv BW_PASSWORD --raw --nointeraction)
          if [ -z "$session" ]; then
            echo "::error::bw unlock returned empty session"
            exit 1
          fi
          # Mask the session so it never appears in logs, then export to env
          echo "::add-mask::$session"
          echo "BW_SESSION=$session" >> "$GITHUB_ENV"

      - name: Sync vault
        run: bw sync --nointeraction

      - name: Fetch WordPress items
        id: fetch
        run: |
          bw list items --search "WordPress" --nointeraction > items.json
          count=$(jq 'map(select(.type == 1 and (.name | test("^wordpress"; "i")))) | length' items.json)
          echo "Found $count matching WordPress login items"
          jq 'map(select(.type == 1 and (.name | test("^wordpress"; "i"))))' items.json > filtered.json
          mv filtered.json items.json

      - name: POST to Vercel ingest endpoint
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          SYNC_INGEST_TOKEN: ${{ secrets.SYNC_INGEST_TOKEN }}
        run: |
          if [ -z "$INGEST_URL" ]; then
            echo "::error::INGEST_URL secret is not set"
            exit 1
          fi
          if [ -z "$SYNC_INGEST_TOKEN" ]; then
            echo "::error::SYNC_INGEST_TOKEN secret is not set"
            exit 1
          fi
          jq -c '{items: .}' items.json > payload.json
          echo "Payload bytes: $(wc -c < payload.json)"
          node <<'EOF'
          const fs = require("fs");
          const { INGEST_URL, SYNC_INGEST_TOKEN } = process.env;
          const base = INGEST_URL.replace(/\/+$/, "");
          const target = base + "/api/blog-agent/receive-credentials";
          console.log("Target:", target);
          const body = fs.readFileSync("payload.json", "utf8");
          (async () => {
            const res = await fetch(target, {
              method: "POST",
              headers: {
                "Authorization": "Bearer " + SYNC_INGEST_TOKEN,
                "Content-Type": "application/json",
              },
              body,
              redirect: "follow",
            });
            const text = await res.text();
            console.log("Ingest responded", res.status + ":", text.slice(0, 500));
            if (!res.ok) process.exit(1);
          })().catch((err) => {
            console.error("POST failed:", err);
            process.exit(1);
          });
          EOF
          rm -f payload.json

      - name: Logout (always)
        if: always()
        run: bw logout || true
